<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- dégradé pastel multicolore -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#ffd9e8"/>
      <stop offset="0.34" stop-color="#e9d4ff"/>
      <stop offset="0.68" stop-color="#d2ecff"/>
      <stop offset="1"    stop-color="#d3ffe8"/>
    </linearGradient>
    <!-- boule douce pêche/rosée -->
    <radialGradient id="ball" cx="36%" cy="30%" r="78%">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#ffe6a8"/>
      <stop offset="100%" stop-color="#ff9eb5"/>
    </radialGradient>
  </defs>

  <!-- fond arrondi (compatible icônes "maskable") -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- bulles pastel décoratives -->
  <circle cx="92"  cy="300" r="54" fill="#ffffff" opacity="0.28"/>
  <circle cx="430" cy="360" r="40" fill="#ffffff" opacity="0.22"/>
  <circle cx="404" cy="92"  r="26" fill="#ffffff" opacity="0.30"/>

  <!-- SUIVI LOTO BINGO -->
  <text x="256" y="52" text-anchor="middle"
        font-family="'Baloo 2',Arial,sans-serif" font-weight="700"
        font-size="34" letter-spacing="2" fill="#8a5cc7">SUIVI LOTO BINGO</text>

  <!-- boule de loto -->
  <circle cx="256" cy="232" r="118" fill="url(#ball)"/>
  <ellipse cx="222" cy="192" rx="36" ry="23" fill="#ffffff" opacity="0.6"/>

  <!-- numéro 64 -->
  <text x="256" y="234" text-anchor="middle" dominant-baseline="central"
        font-family="'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif"
        font-weight="700" font-size="120" fill="#7a3f6e">64</text>

  <!-- nom de la marque -->
  <text x="256" y="452" text-anchor="middle"
        font-family="'Baloo 2',Arial,sans-serif" font-weight="700"
        font-size="86" letter-spacing="2" fill="#6c4bb3">LULU 64</text>
</svg>
