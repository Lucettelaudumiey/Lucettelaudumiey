<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3390"/>
      <stop offset="1" stop-color="#6a2d8f"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </radialGradient>
  </defs>

  <!-- fond arrondi (compatible icônes "maskable") -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- petite étoile / éclat décoratif -->
  <circle cx="120" cy="110" r="10" fill="#ffffff" opacity="0.5"/>
  <circle cx="402" cy="138" r="7" fill="#ffffff" opacity="0.4"/>

  <!-- boule de loto -->
  <circle cx="256" cy="262" r="150" fill="url(#ball)"/>
  <ellipse cx="212" cy="208" rx="46" ry="30" fill="#ffffff" opacity="0.55"/>

  <!-- numéro 64 -->
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif"
        font-weight="700" font-size="150" fill="#3a2400">64</text>

  <!-- libellé LOTO -->
  <text x="256" y="452" text-anchor="middle"
        font-family="'Baloo 2',Arial,sans-serif" font-weight="700"
        font-size="58" letter-spacing="6" fill="#ffd23f">LOTO</text>
</svg>
