<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3390"/>
      <stop offset="1" stop-color="#6a2d8f"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </radialGradient>
  </defs>

  <!-- fond arrondi (compatible icônes "maskable") -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- éclats décoratifs -->
  <circle cx="92" cy="120" r="9" fill="#ffffff" opacity="0.5"/>
  <circle cx="420" cy="150" r="6" fill="#ffffff" opacity="0.4"/>

  <!-- LOTO BINGO -->
  <text x="256" y="74" text-anchor="middle"
        font-family="'Baloo 2',Arial,sans-serif" font-weight="700"
        font-size="46" letter-spacing="4" fill="#ffd23f">LOTO BINGO</text>

  <!-- boule de loto -->
  <circle cx="256" cy="268" r="138" fill="url(#ball)"/>
  <ellipse cx="216" cy="220" rx="42" ry="27" fill="#ffffff" opacity="0.55"/>

  <!-- numéro 64 -->
  <text x="256" y="270" text-anchor="middle" dominant-baseline="central"
        font-family="'Baloo 2','Arial Rounded MT Bold',Arial,sans-serif"
        font-weight="700" font-size="140" fill="#3a2400">64</text>

  <!-- LUCETTE LAUDUMIEY -->
  <text x="256" y="470" text-anchor="middle"
        font-family="'Baloo 2',Arial,sans-serif" font-weight="700"
        font-size="40" letter-spacing="1" fill="#ffffff">LUCETTE LAUDUMIEY</text>
</svg>
